version: 1
profile: backend
source_dirs:
  - src/
generated_dirs:
  - dist/
commands:
  build: <build-command>
  lint: <lint-command>
  test: <test-command>
  check: <check-command>

# ---- 启动命令（可选；工程有启动入口时取消注释并填真实命令）----
# 约定：启动脚本放 source_dirs 指向的源码区（如 src/、bin/、scripts/、package.json scripts），
#       命令登记在此处后，AI 通过 aios.config.yaml 即可发现并调用
#       （cli/lib/config.py 保留 commands 额外键，不限于 build/lint/test/check）。
# commands:
#   start: <启动命令，如 go run ./cmd/server / npm run start / python -m src>
#   dev:   <开发模式命令，如 air / nodemon>

# ---- SDD 扩展字段（仅当任务命中 aios/execution/sdd-workflow.md 场景 A 时需要，取消注释并按需修改）----
# project:
#   kind: api-service
# spec:
#   type: contract
#   file: <契约文件路径，如 openapi.yaml / proto/api.proto>
#   metadata_keys: []          # AI 可读元数据字段（如有）
# commands:
#   validate_spec: <校验契约的命令>
#   generate: <根据契约重新生成代码的命令>
